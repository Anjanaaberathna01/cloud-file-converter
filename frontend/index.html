<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>File Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="hero">
    <div class="bar">
      <button class="ic" id="menu" aria-label="Conversion history">☰</button>
      <h1>File Converter</h1>
      <button class="crown" id="pro" aria-label="Go Pro">👑</button>
    </div>
    <h2>Convert your files in multiple formats</h2>
    <button class="upload" id="quick">⇪ Upload File</button>
    <input type="file" id="qf" hidden>
  </header>
  <section class="cards">
    <button class="card" id="goBatch"><i>🗂</i><b>Batch Conversions</b></button>
    <button class="card" id="goHist"><i>🕘</i><b>Conversions History</b></button>
  </section>
  <h3>All tools</h3>
  <div id="tools" class="grid"></div>
  <h3>Recent</h3>
  <div id="recent"></div>
</main>
<div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
